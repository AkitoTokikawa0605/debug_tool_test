<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>魔界検索ツール</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a00ff">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(to bottom right, #1a1a1a, #3a0a5c, #1a1a1a);
  color: white;
  text-align: center;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  padding: 30px;
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
  text-shadow: 0 0 15px #a855ff;
}

p {
  font-size: 18px;
  opacity: 0.9;
}

.button {
  margin-top: 30px;
  padding: 15px 30px;
  border: none;
  border-radius: 12px;
  background: #7a00ff;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.button:hover {
  background: #9d33ff;
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">
  <h1>魔界検索ツール</h1>
  <p>PWA対応版</p>

  <button class="button" onclick="alert('アプリ化成功！')">
    起動確認
  </button>
</div>

<!-- Service Worker登録 -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js")
    .then(() => {
      console.log("Service Worker 登録成功");
    })
    .catch((error) => {
      console.log("Service Worker 登録失敗", error);
    });
}
</script>

</body>
</html>
